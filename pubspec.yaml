name: raph
description: "A new Flutter package project."
version: 0.0.1

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  user_session_contract:
    git:
      url: https://github.com/Aminoacido78/UserSessionContract.git
      ref: main
  file_picker: ^8.0.0
  pointer_interceptor: ^0.10.1
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.0
  http: ^1.1.0
  google_maps_flutter: ^2.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

